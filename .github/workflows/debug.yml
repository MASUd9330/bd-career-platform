name: Debug Status

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Reset raw contents (testing only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run reset:raw
      - name: Run crawl pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run collect
      - name: Dump DB status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/debug-status.ts
      - name: Commit status file
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add debug-status.json
          git commit -m "Debug status snapshot" || echo "no changes"
          git push
