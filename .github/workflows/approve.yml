name: Approve Pending Posts

on:
  workflow_dispatch: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Approve pending posts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run approve:pending
